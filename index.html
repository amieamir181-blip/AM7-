<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AM7 Market | مقایسه قیمت</title><meta name="description" content="مقایسه قیمت محصولات و مشاهده پیشنهاد فروشگاه‌ها در AM7 Market">
<style>
:root{--red:#d92f36;--orange:#ff8a00;--bg:#f5f6f8;--line:#e7e8ed;--text:#20232a;--muted:#727782;--green:#16834b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.8}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,.btn{border:0;border-radius:10px;padding:9px 15px;background:linear-gradient(130deg,var(--red),var(--orange));color:white;cursor:pointer;display:inline-block}.btn.secondary,button.secondary{background:#fff;color:var(--red);border:1px solid var(--red)}.btn.danger,button.danger{background:#b4232c}.wrap{max-width:1160px;margin:auto;padding:0 14px}.header{background:white;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--orange);box-shadow:0 2px 10px #00000008}.top{display:flex;align-items:center;gap:15px;padding-top:10px;padding-bottom:10px}.logo{font-weight:900;font-size:25px;color:var(--red);white-space:nowrap}.logo span{color:var(--orange)}.search{display:flex;flex:1;min-width:180px}.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:0 10px 10px 0;padding:10px}.search button{border-radius:10px 0 0 10px}.adminlink{font-size:13px;color:var(--muted);white-space:nowrap}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.nav a{white-space:nowrap;background:#fff1e5;color:#a84a00;padding:4px 12px;border-radius:20px;font-size:13px}.hero{margin:20px 0;background:linear-gradient(120deg,#d92f36,#ff8a00);color:#fff;text-align:center;padding:32px 15px;border-radius:18px}.hero h1{margin:0;font-size:26px}.hero p{margin:5px 0 0}.notice{background:#fff8e8;border:1px solid #ffe0a3;padding:10px 13px;border-radius:10px;color:#775016;font-size:13px;margin:14px 0}.section-title{font-size:19px;margin:25px 0 12px;border-right:5px solid var(--orange);padding-right:10px}.categories,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.categories a,.card,.panel{background:white;border:1px solid var(--line);border-radius:14px}.categories a{text-align:center;padding:14px}.categories b{display:block;font-size:30px}.grid{grid-template-columns:repeat(auto-fill,minmax(195px,1fr))}.card{padding:12px;display:flex;flex-direction:column;gap:6px}.card:hover{border-color:var(--orange);box-shadow:0 5px 18px #0000000d}.pic{height:150px;background:#fafafa;border-radius:10px;display:grid;place-items:center;font-size:55px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain}.card h3{font-size:14px;margin:4px 0;min-height:50px}.price{color:var(--red);font-weight:bold}.muted{color:var(--muted);font-size:12px}.panel{padding:16px;margin:14px 0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toolbar h2{margin:12px 0}.detail{display:grid;grid-template-columns:280px 1fr;gap:18px}.detail .pic{height:280px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:500px}th,td{text-align:right;padding:9px;border-bottom:1px solid var(--line)}th{background:#fff2e5}.best{background:#effaf3}.tag{background:var(--green);color:#fff;padding:1px 7px;border-radius:5px;font-size:11px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.formgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px}.formgrid input,.formgrid select,.formgrid textarea,.toolbar select{border:1px solid var(--line);border-radius:8px;padding:9px;background:white;max-width:100%;width:100%}.full{grid-column:1/-1}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs a{background:white;border:1px solid var(--line);padding:6px 13px;border-radius:20px}.tabs a.active{background:var(--red);color:white}.empty{text-align:center;color:var(--muted);padding:35px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.footer{text-align:center;margin-top:35px;padding:20px;background:white;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,80px);opacity:0;background:#222;color:white;padding:9px 18px;border-radius:10px;transition:.2s;z-index:10}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:650px){.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}.detail{grid-template-columns:1fr}.detail .pic{height:220px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:21px}}
</style></head>
<body>
<header class="header"><div class="wrap top"><a class="logo" href="#/">AM7<span> Market</span></a><form class="search" id="searchForm"><input id="searchInput" placeholder="نام محصول یا برند را جست‌وجو کنید…"><button>جست‌وجو</button></form><a class="adminlink" href="#/admin">پنل مدیریت</a></div><nav class="wrap nav" id="nav"></nav></header>
<main class="wrap" id="app"></main><footer class="footer">AM7 Market — موتور مقایسه قیمت<br>قیمت‌ها و فروشگاه‌های اولیه صرفاً نمونه‌اند و خرید واقعی از طریق آن‌ها انجام نمی‌شود.</footer><div class="toast" id="toast"></div>
<script>
'use strict';
const CATS=[['mobile','موبایل','📱'],['laptop','لپ‌تاپ','💻'],['home','لوازم خانگی','🏠'],['clothes','پوشاک','👕'],['car','خودرو','🚗'],['beauty','آرایشی و بهداشتی','💄'],['sport','ورزش و سرگرمی','⚽']];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n||0).toLocaleString('fa-IR'), cat=id=>CATS.find(c=>c[0]===id)||CATS[0], id=()=>Math.random().toString(36).slice(2,10);
const KEY='am7_market_data_v2', CREDS='am7_market_admin_v2';
function seed(){let stores=[{id:'s1',name:'فروشگاه نمونه الف',url:'https://example.com',city:'تهران'},{id:'s2',name:'فروشگاه نمونه ب',url:'https://example.org',city:'اصفهان'}];let products=[['گوشی موبایل مدل Nova X 128GB','mobile','Nova',14500000,14200000],['لپ‌تاپ مدل Zeta Book 15','laptop','Zeta',38900000,37800000],['جاروبرقی مدل Clean Pro','home','CleanPro',4200000,4050000],['کفش ورزشی مدل Run Fast','clothes','RunFast',2450000,2390000],['دوربین خودرو DriveCam HD','car','DriveCam',2300000,2250000],['کرم مرطوب‌کننده Soft Skin','beauty','SoftSkin',420000,395000],['توپ فوتبال Pro Match','sport','ProMatch',780000,750000]].map(x=>({id:id(),name:x[0],cat:x[1],brand:x[2],img:'',specs:{},created:Date.now(),offers:[{sid:'s1',price:x[3],url:'https://example.com'},{sid:'s2',price:x[4],url:'https://example.org'}]}));return{stores,products}}
function getData(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.products)&&Array.isArray(d.stores))return d}catch(e){}let d=seed();saveData(d);return d}function saveData(d){localStorage.setItem(KEY,JSON.stringify(d))}let data=getData();
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function min(p){return p.offers.length?Math.min(...p.offers.map(o=>+o.price)):null}function icon(p){return `<div class="pic">${p.img&&/^https:\/\//i.test(p.img)?`<img src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.remove()">`:cat(p.cat)[2]}</div>`}
function card(p){return `<a class="card" href="#/product/${esc(p.id)}">${icon(p)}<h3>${esc(p.name)}</h3><div class="price">${min(p)?'از '+money(min(p))+' تومان':'ناموجود'}</div><div class="muted">${money(p.offers.length)} فروشگاه</div></a>`}
function grid(ps){return ps.length?`<div class="grid">${ps.map(card).join('')}</div>`:'<div class="empty">محصولی پیدا نشد.</div>'}
function home(){let cheap=[...data.products].filter(p=>min(p)).sort((a,b)=>min(a)-min(b)).slice(0,8);return `<section class="hero"><h1>ارزان‌ترین قیمت را پیدا کنید</h1><p>محصولات را مقایسه کنید و پیشنهادهای فروشگاه‌ها را ببینید.</p></section><div class="notice">توجه: قیمت‌ها و لینک‌های فروشگاه در این نسخه آزمایشی هستند؛ برای قیمت واقعی باید منبع داده و فروشگاه‌های معتبر متصل شوند.</div><h2 class="section-title">دسته‌بندی‌ها</h2><div class="categories">${CATS.map(c=>`<a href="#/category/${c[0]}"><b>${c[2]}</b>${c[1]}</a>`).join('')}</div><h2 class="section-title">ارزان‌ترین محصولات</h2>${grid(cheap)}<h2 class="section-title">همه محصولات</h2>${grid(data.products.slice(0,8))}`}
function listing(kind,val){let ps=data.products.filter(p=>kind==='cat'?p.cat===val:((p.name+' '+p.brand).toLowerCase().includes(val.toLowerCase())));ps.sort((a,b)=>(min(a)||Infinity)-(min(b)||Infinity));return `<div class="toolbar"><h2 class="section-title">${kind==='cat'?esc(cat(val)[1]):'نتایج جست‌وجو: '+esc(val)}</h2><span class="muted">${money(ps.length)} کالا</span></div>${grid(ps)}`}
function product(pid){let p=data.products.find(x=>x.id===pid);if(!p)return '<div class="empty">محصول پیدا نشد.</div>';let offers=[...p.offers].sort((a,b)=>a.price-b.price);let rows=offers.map((o,i)=>{let s=data.stores.find(x=>x.id===o.sid);let valid=/^https:\/\//i.test(o.url);return `<tr class="${i===0?'best':''}"><td>${esc(s?.name||'فروشگاه حذف‌شده')} ${i===0?'<span class="tag">ارزان‌ترین</span>':''}<div class="muted">${esc(s?.city||'')}</div></td><td class="price">${money(o.price)} تومان</td><td>${valid?`<a class="btn" target="_blank" rel="noopener noreferrer nofollow" href="${esc(o.url)}">مشاهده فروشگاه</a>`:'—'}</td></tr>`}).join('');let specs=Object.entries(p.specs||{}).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');return `<p class="muted"><a href="#/">خانه</a> / ${esc(cat(p.cat)[1])}</p><div class="detail"><div>${icon(p)}</div><div><h1>${esc(p.name)}</h1><p>برند: ${esc(p.brand||'—')}</p><p>کمترین قیمت: <b class="price">${min(p)?money(min(p))+' تومان':'ناموجود'}</b></p></div></div><h2 class="section-title">مقایسه قیمت فروشگاه‌ها</h2><div class="panel tablewrap">${offers.length?`<table><tr><th>فروشگاه</th><th>قیمت</th><th>لینک</th></tr>${rows}</table>`:'پیشنهادی ثبت نشده است.'}</div><h2 class="section-title">مشخصات محصول</h2><div class="panel tablewrap">${specs?`<table>${specs}</table>`:'مشخصاتی ثبت نشده است.'}</div>`}
function admin(){if(!sessionStorage.getItem('am7_admin_ok'))return `<div class="panel" style="max-width:420px;margin:35px auto"><h2>ورود مدیر</h2><form id="loginForm" class="formgrid"><label class="full">نام کاربری<input name="user" required></label><label class="full">رمز عبور<input name="pass" type="password" required></label><button class="full">ورود</button></form><p class="muted">اگر اولین بار است، از بخش «ساخت حساب مدیر» استفاده کن.</p><button class="secondary" id="setupBtn">ساخت حساب مدیر</button></div>`;let tab=new URLSearchParams(location.hash.split('?')[1]||'').get('t')||'products';let body='';if(tab==='products'){body=`<div class="panel"><h3>افزودن محصول</h3><form id="productForm" class="formgrid"><label>نام محصول<input name="name" required maxlength="140"></label><label>برند<input name="brand"></label><label>دسته‌بندی<select name="cat">${CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></label><label>لینک عکس (اختیاری)<input name="img" type="url" placeholder="https://..."></label><label class="full">مشخصات (هر خط: عنوان: مقدار)<textarea name="specs" rows="3"></textarea></label><button>افزودن محصول</button></form></div><div class="panel tablewrap"><table><tr><th>محصول</th><th>دسته</th><th>قیمت‌ها</th><th>عملیات</th></tr>${data.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(cat(p.cat)[1])}</td><td>${money(p.offers.length)}</td><td class="row"><button class="secondary" data-edit="${p.id}">ویرایش</button><button class="danger" data-del="${p.id}">حذف</button></td></tr>`).join('')}</table></div>`}else if(tab==='offers'){body=`<div class="panel"><h3>ثبت یا به‌روزرسانی قیمت</h3><form id="offerForm" class="formgrid"><label>محصول<select name="pid">${data.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>فروشگاه<select name="sid">${data.stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label>قیمت به تومان<input name="price" type="number" min="1" required></label><label>لینک محصول (https)<input name="url" type="url" required placeholder="https://..."></label><button>ثبت قیمت</button></form></div><div class="panel tablewrap"><table><tr><th>محصول</th><th>فروشگاه</th><th>قیمت</th><th>عملیات</th></tr>${data.products.flatMap(p=>p.offers.map((o,i)=>`<tr><td>${esc(p.name)}</td><td>${esc(data.stores.find(s=>s.id===o.sid)?.name||'—')}</td><td>${money(o.price)} تومان</td><td><button class="danger" data-remove-offer="${p.id}|${i}">حذف</button></td></tr>`)).join('')}</table></div>`}else if(tab==='stores'){body=`<div class="panel"><h3>افزودن فروشگاه</h3><form id="storeForm" class="formgrid"><label>نام فروشگاه<input name="name" required></label><label>شهر<input name="city"></label><label>آدرس سایت (https)<input name="url" type="url" required></label><button>ثبت فروشگاه</button></form></div><div class="panel">${data.stores.map(s=>`<p>${esc(s.name)} — ${esc(s.city)} — ${esc(s.url)}</p>`).join('')}</div>`}else if(tab==='backup'){body=`<div class="panel"><h3>پشتیبان‌گیری</h3><p>اطلاعات فعلی این مرورگر را به فایل JSON صادر یا از فایل قبلی بازیابی کن.</p><button id="exportBtn">دریافت پشتیبان</button> <label class="btn secondary">بازیابی فایل<input id="importFile" type="file" accept="application/json" hidden></label></div>`}else{body=`<div class="panel"><h3>وضعیت نسخه</h3><p>این نسخه آزمایشی اطلاعات را فقط در مرورگر همین دستگاه ذخیره می‌کند. برای پنل امن چندکاربره و همگام‌سازی، بک‌اند و دیتابیس لازم است.</p><button id="logoutBtn" class="danger">خروج از مدیریت</button></div>`}return `<h2 class="section-title">پنل مدیریت</h2><div class="tabs"><a class="${tab==='products'?'active':''}" href="#/admin?t=products">محصولات</a><a class="${tab==='stores'?'active':''}" href="#/admin?t=stores">فروشگاه‌ها</a><a class="${tab==='offers'?'active':''}" href="#/admin?t=offers">قیمت‌ها</a><a class="${tab==='backup'?'active':''}" href="#/admin?t=backup">پشتیبان</a><a class="${tab==='settings'?'active':''}" href="#/admin?t=settings">تنظیمات</a></div>${body}`}
function render(){data=getData();let h=location.hash||'#/';let app=$('#app');if(h.startsWith('#/product/'))app.innerHTML=product(decodeURIComponent(h.split('/')[2]||''));else if(h.startsWith('#/category/'))app.innerHTML=listing('cat',h.split('/')[2]);else if(h.startsWith('#/search/'))app.innerHTML=listing('search',decodeURIComponent(h.slice(8)));else if(h.startsWith('#/admin'))app.innerHTML=admin();else app.innerHTML=home();$('#nav').innerHTML=CATS.map(c=>`<a href="#/category/${c[0]}">${c[2]} ${c[1]}</a>`).join('');}
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();let q=$('#searchInput').value.trim();if(q)location.hash='#/search/'+encodeURIComponent(q)});window.addEventListener('hashchange',render);
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();let f=new FormData(e.target),c=JSON.parse(localStorage.getItem(CREDS)||'null');if(c&&f.get('user')===c.user&&f.get('pass')===c.pass){sessionStorage.setItem('am7_admin_ok','1');render()}else toast('نام کاربری یا رمز اشتباه است')}if(e.target.id==='productForm'){e.preventDefault();let f=new FormData(e.target),specs={};String(f.get('specs')).split('\n').forEach(line=>{let i=line.indexOf(':');if(i>0)specs[line.slice(0,i).trim()]=line.slice(i+1).trim()});data.products.unshift({id:id(),name:f.get('name'),brand:f.get('brand'),cat:f.get('cat'),img:f.get('img'),specs,created:Date.now(),offers:[]});saveData(data);render();toast('محصول اضافه شد')}if(e.target.id==='offerForm'){e.preventDefault();let f=new FormData(e.target),p=data.products.find(x=>x.id===f.get('pid')),url=f.get('url'),price=Number(f.get('price'));if(!p||!/^https:\/\//i.test(url)||!Number.isFinite(price)||price<=0){toast('اطلاعات قیمت معتبر نیست');return}let old=p.offers.find(o=>o.sid===f.get('sid'));if(old){old.price=price;old.url=url}else p.offers.push({sid:f.get('sid'),price,url});saveData(data);render();toast('قیمت ثبت شد')}if(e.target.id==='storeForm'){e.preventDefault();let f=new FormData(e.target),url=f.get('url');if(!/^https:\/\//i.test(url)){toast('آدرس باید با https شروع شود');return}data.stores.push({id:id(),name:f.get('name'),city:f.get('city'),url});saveData(data);render();toast('فروشگاه اضافه شد')}});
document.addEventListener('click',e=>{if(e.target.id==='setupBtn'){let u=prompt('نام کاربری مدیر (حداقل 3 حرف):'),p=prompt('رمز عبور مدیر (حداقل 10 کاراکتر):');if(!u||u.length<3||!p||p.length<10){toast('اطلاعات معتبر وارد کن');return}localStorage.setItem(CREDS,JSON.stringify({user:u,pass:p}));toast('حساب ساخته شد؛ وارد شو')}if(e.target.dataset.removeOffer){let [pid,idx]=e.target.dataset.removeOffer.split('|');let p=data.products.find(x=>x.id===pid);if(p){p.offers.splice(Number(idx),1);saveData(data);render();toast('قیمت حذف شد')}}if(e.target.dataset.del){if(confirm('این محصول حذف شود؟')){data.products=data.products.filter(p=>p.id!==e.target.dataset.del);saveData(data);render();toast('حذف شد')}}if(e.target.dataset.edit){let p=data.products.find(x=>x.id===e.target.dataset.edit);let name=prompt('نام محصول:',p.name);if(name){p.name=name;saveData(data);render();toast('ویرایش شد')}}if(e.target.id==='logoutBtn'){sessionStorage.removeItem('am7_admin_ok');render()}if(e.target.id==='exportBtn'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='am7-market-backup.json';a.click();URL.revokeObjectURL(a.href)}});
document.addEventListener('change',e=>{if(e.target.id==='importFile'){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.stores))throw Error();saveData(d);render();toast('پشتیبان بازیابی شد')}catch(_){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(file)}});
render();
</script></body></html>
